<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" role="img" aria-label="curdx-flow spec-driven workflow: research, requirements, design, tasks, implement">
  <style>
    .title    { fill: currentColor; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 0.02em; }
    .phase    { fill: currentColor; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 15px; font-weight: 700; }
    .cmd      { fill: currentColor; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace; font-size: 12px; opacity: 0.78; }
    .sub      { fill: currentColor; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 11.5px; opacity: 0.62; }
    .badge    { fill: currentColor; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace; font-size: 10.5px; opacity: 0.85; font-weight: 700; }
    .node     { fill: rgba(91,108,255,0.07); stroke: #5B6CFF; stroke-width: 1.5; }
    .node-hot { fill: rgba(255,107,53,0.10); stroke: #FF6B35; stroke-width: 2; }
    .arrow    { fill: none; stroke: currentColor; stroke-width: 1.4; opacity: 0.5; }
    .loop     { fill: none; stroke: #FF6B35; stroke-width: 1.8; stroke-dasharray: 5 4; opacity: 0.85; }
    .num      { fill: #5B6CFF; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; font-weight: 700; }
    .num-hot  { fill: #FF6B35; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; font-weight: 700; }
  </style>

  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" opacity="0.5"/>
    </marker>
    <marker id="arrowhot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF6B35"/>
    </marker>
  </defs>

  <text x="40" y="40" class="title">Spec-driven workflow</text>
  <text x="40" y="62" class="sub">A vague idea goes in. Tested, committed code comes out — task-by-task, fresh context per task.</text>

  <!-- Phase 1: research -->
  <g transform="translate(40, 110)">
    <rect class="node" width="180" height="120" rx="12"/>
    <text x="14" y="24" class="num">01</text>
    <text x="14" y="50" class="phase">research</text>
    <text x="14" y="74" class="cmd">/curdx-flow:research</text>
    <text x="14" y="98" class="sub">parallel research team</text>
    <text x="14" y="112" class="sub">→ research.md</text>
  </g>

  <!-- Phase 2: requirements -->
  <g transform="translate(240, 110)">
    <rect class="node" width="180" height="120" rx="12"/>
    <text x="14" y="24" class="num">02</text>
    <text x="14" y="50" class="phase">requirements</text>
    <text x="14" y="74" class="cmd">/curdx-flow:requirements</text>
    <text x="14" y="98" class="sub">product-manager agent</text>
    <text x="14" y="112" class="sub">→ requirements.md</text>
  </g>

  <!-- Phase 3: design -->
  <g transform="translate(440, 110)">
    <rect class="node" width="180" height="120" rx="12"/>
    <text x="14" y="24" class="num">03</text>
    <text x="14" y="50" class="phase">design</text>
    <text x="14" y="74" class="cmd">/curdx-flow:design</text>
    <text x="14" y="98" class="sub">architect-reviewer</text>
    <text x="14" y="112" class="sub">→ design.md</text>
  </g>

  <!-- Phase 4: tasks -->
  <g transform="translate(640, 110)">
    <rect class="node" width="180" height="120" rx="12"/>
    <text x="14" y="24" class="num">04</text>
    <text x="14" y="50" class="phase">tasks</text>
    <text x="14" y="74" class="cmd">/curdx-flow:tasks</text>
    <text x="14" y="98" class="sub">task-planner</text>
    <text x="14" y="112" class="sub">→ tasks.md</text>
  </g>

  <!-- Phase 5: implement -->
  <g transform="translate(840, 110)">
    <rect class="node-hot" width="220" height="120" rx="12"/>
    <text x="14" y="24" class="num-hot">05</text>
    <text x="14" y="50" class="phase">implement</text>
    <text x="14" y="74" class="cmd">/curdx-flow:implement</text>
    <text x="14" y="98" class="sub">spec-executor (autonomous)</text>
    <text x="14" y="112" class="sub">→ tested, committed code</text>
  </g>

  <!-- Forward arrows between phases -->
  <line class="arrow" x1="225" y1="170" x2="235" y2="170" marker-end="url(#arrowhead)"/>
  <line class="arrow" x1="425" y1="170" x2="435" y2="170" marker-end="url(#arrowhead)"/>
  <line class="arrow" x1="625" y1="170" x2="635" y2="170" marker-end="url(#arrowhead)"/>
  <line class="arrow" x1="825" y1="170" x2="835" y2="170" marker-end="url(#arrowhead)"/>

  <!-- Autonomous loop arc on implement -->
  <path class="loop" d="M 1060 170 q 40 0 40 50 q 0 50 -110 50 q -110 0 -110 -50 q 0 -30 30 -45" marker-end="url(#arrowhot)"/>
  <text x="935" y="320" class="badge" fill="#FF6B35">↻ task ✓ → next task → ALL_TASKS_COMPLETE</text>

  <!-- Bottom hint -->
  <text x="40" y="320" class="sub">Each phase pauses for human approval. The implement phase loops autonomously until every task verifies.</text>
  <text x="40" y="340" class="sub">All artifacts live in <tspan class="cmd">specs/&lt;name&gt;/</tspan> and version with your repo.</text>
</svg>
