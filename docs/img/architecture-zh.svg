<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" role="img" aria-label="curdx-flow 架构：一个 npm 包，两个产品">
  <style>
    .title    { fill: currentColor; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; font-size: 18px; font-weight: 700; }
    .head     { fill: currentColor; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; font-size: 15px; font-weight: 700; }
    .item     { fill: currentColor; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; font-size: 12.5px; opacity: 0.8; }
    .cmd      { fill: currentColor; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12.5px; opacity: 0.92; }
    .sub      { fill: currentColor; font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; font-size: 11.5px; opacity: 0.62; }
    .badge    { fill: currentColor; font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; opacity: 0.85; }
    .box      { fill: rgba(91,108,255,0.06); stroke: #5B6CFF; stroke-width: 1.5; }
    .box-acc  { fill: rgba(255,107,53,0.08); stroke: #FF6B35; stroke-width: 1.8; }
    .box-out  { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: 0.35; stroke-dasharray: 4 3; }
    .arrow    { fill: none; stroke: currentColor; stroke-width: 1.4; opacity: 0.55; }
  </style>

  <defs>
    <marker id="ah2-zh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" opacity="0.55"/>
    </marker>
  </defs>

  <text x="40" y="40" class="title">一个 npm 包，两个产品</text>
  <text x="40" y="62" class="sub">运行一次，即可获得开箱即用的 Claude Code 开发环境。</text>

  <g transform="translate(380, 95)">
    <rect class="box-acc" width="340" height="58" rx="10"/>
    <text x="170" y="25" class="cmd" text-anchor="middle">npx @curdx/flow</text>
    <text x="170" y="45" class="sub" text-anchor="middle">交互式 — 自由选择安装项</text>
  </g>

  <line class="arrow" x1="450" y1="160" x2="240" y2="200" marker-end="url(#ah2-zh)"/>
  <line class="arrow" x1="650" y1="160" x2="860" y2="200" marker-end="url(#ah2-zh)"/>

  <g transform="translate(40, 200)">
    <rect class="box-acc" width="420" height="195" rx="12"/>
    <text x="20" y="30" class="badge" fill="#FF6B35">产品一 — 内置于本仓库</text>
    <text x="20" y="55" class="head">curdx-flow 插件</text>
    <text x="20" y="76" class="sub">规格驱动开发工作流，支持自主执行。</text>

    <text x="20" y="106" class="cmd">/curdx-flow:start</text>
    <text x="200" y="106" class="sub">智能入口 — 新建或恢复 spec</text>

    <text x="20" y="128" class="cmd">/curdx-flow:research</text>
    <text x="200" y="128" class="sub">→ requirements → design → tasks</text>

    <text x="20" y="150" class="cmd">/curdx-flow:implement</text>
    <text x="200" y="150" class="sub">自主任务循环，直至完成</text>

    <text x="20" y="172" class="cmd">/curdx-flow:triage</text>
    <text x="200" y="172" class="sub">将大型需求分解为依赖图</text>
  </g>

  <g transform="translate(640, 200)">
    <rect class="box" width="420" height="195" rx="12"/>
    <text x="20" y="30" class="badge" fill="#5B6CFF">产品二 — 安装与管理</text>
    <text x="20" y="55" class="head">插件与 MCP 市场</text>
    <text x="20" y="76" class="sub">统一的安装器，支持幂等更新、状态查询与卸载。</text>

    <text x="20" y="106" class="item">• claude-mem      <tspan class="sub">— 跨会话记忆</tspan></text>
    <text x="20" y="128" class="item">• pua             <tspan class="sub">— 抗失败压力模式</tspan></text>
    <text x="20" y="150" class="item">• chrome-devtools-mcp  <tspan class="sub">— 浏览器 MCP</tspan></text>
    <text x="20" y="172" class="item">• context7 / sequential-thinking  <tspan class="sub">— MCP 服务器</tspan></text>
  </g>

  <g transform="translate(380, 415)">
    <rect class="box-out" width="340" height="36" rx="8"/>
    <text x="170" y="23" class="cmd" text-anchor="middle">~/.claude/  ·  CLAUDE.md（受管理块）</text>
  </g>

  <line class="arrow" x1="250" y1="395" x2="450" y2="425" marker-end="url(#ah2-zh)"/>
  <line class="arrow" x1="850" y1="395" x2="650" y2="425" marker-end="url(#ah2-zh)"/>
</svg>
